<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datafoot IA</title>
  <link rel="icon" type="image/png" href="1787440803187.png">
  <link rel="apple-touch-icon" href="1787440803187.png">
  <style>
    :root {
      --bg: #0d0e12;
      --card-bg: #16181e;
      --primary: #00e676;
      --primary-hover: #00c853;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #27272a;
      --danger: #ff5252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; }

    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 14px; color: var(--primary); }

    .tabs {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--muted);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .tab.active { background: var(--primary); color: #000; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      background: #09090b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    button {
      width: 100%;
      background: var(--primary);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-small {
      padding: 6px 12px;
      font-size: 0.8rem;
      width: auto;
    }

    .spinner {
      width: 30px; height: 30px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 15px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .match-item {
      background: #09090b;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .match-teams { font-size: 0.9rem; font-weight: bold; }
    .match-time { font-size: 0.75rem; color: var(--primary); margin-top: 2px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }

    .analysis {
      background: #09090b;
      border-left: 4px solid var(--primary);
      padding: 14px;
      border-radius: 0 8px 8px 0;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <h1>Datafoot IA</h1>

  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">⚽ Jogos Hoje</div>
    <div class="tab" onclick="switchTab(1)">🏆 Classificação</div>
    <div class="tab" onclick="switchTab(2)">🤖 Analisador IA</div>
  </div>

  <!-- ABA 1: JOGOS DO DIA -->
  <div class="tab-content active" id="tab-jogos">
    <div class="card">
      <div class="form-group">
        <label>Selecione a Competição</label>
        <select id="competicaoJogos" onchange="carregarJogos()">
          <option value="Brasileirão Série A">🇧🇷 Brasileirão Série A</option>
          <option value="Premier League">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</option>
          <option value="La Liga">🇪🇸 La Liga</option>
          <option value="Serie A Itália">🇮🇹 Serie A (Itália)</option>
          <option value="Ligue 1">🇫🇷 Ligue 1</option>
        </select>
      </div>
      <div id="listaJogos"></div>
    </div>
  </div>

  <!-- ABA 2: CLASSIFICAÇÃO -->
  <div class="tab-content" id="tab-tabela">
    <div class="card">
      <div class="form-group">
        <label>Selecione o Campeonato</label>
        <select id="competicaoTabela" onchange="carregarTabela()">
          <option value="Brasileirão Série A">🇧🇷 Brasileirão Série A</option>
          <option value="Premier League">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</option>
          <option value="La Liga">🇪🇸 La Liga</option>
          <option value="Serie A Itália">🇮🇹 Serie A (Itália)</option>
          <option value="Ligue 1">🇫🇷 Ligue 1</option>
        </select>
      </div>
      <div id="tabelaContainer" style="overflow-x: auto;"></div>
    </div>
  </div>

  <!-- ABA 3: ANALISADOR IA -->
  <div class="tab-content" id="tab-analisador">
    <div class="card">
      <div class="grid-2">
        <div class="form-group">
          <label>Esporte</label>
          <select id="esporte">
            <option value="Futebol">Futebol</option>
            <option value="Basquete (NBA)">Basquete (NBA)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Liga / Campeonato</label>
          <input type="text" id="liga" placeholder="Ex: Brasileirão Série A">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Time Casa / Mandante</label>
          <input type="text" id="manualHome" placeholder="Ex: Flamengo">
        </div>
        <div class="form-group">
          <label>Time Fora / Visitante</label>
          <input type="text" id="manualAway" placeholder="Ex: Palmeiras">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Nível de Risco</label>
          <select id="risco">
            <option value="Conservador">Conservador (Baixo Risco)</option>
            <option value="Moderado" selected>Moderado</option>
            <option value="Arriscado">Arriscado (Odds Altas)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Observações / Infos</label>
          <input type="text" id="observacoes" placeholder="Ex: Titulares poupados">
        </div>
      </div>

      <button id="btnAnalisar" onclick="analisarComIA()">Gerar Análise</button>
      <div id="analiseArea"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      carregarJogos();
    });

    function switchTab(index) {
      const tabs = document.querySelectorAll('.tab');
      const contents = document.querySelectorAll('.tab-content');
      
      tabs.forEach((t, i) => {
        t.classList.toggle('active', i === index);
        contents[i].classList.toggle('active', i === index);
      });

      if(index === 0) carregarJogos();
      if(index === 1) carregarTabela();
    }

    function obterOuPedirChave() {
      // Retorna diretamente a sua chave ativa do AI Studio
      return 'AQ.Ab8RN6JzzPP0Hz5KkE3YIAYn0WSICYRn...HMcA';
    }

    async function carregarJogos() {
      const container = document.getElementById('listaJogos');
      const liga = document.getElementById('competicaoJogos').value;
      const apiKey = obterOuPedirChave();

      container.innerHTML = `<div class="spinner"></div>`;

      const prompt = `Liste os próximos jogos mais recentes ou da rodada atual do campeonato ${liga}.
Retorne um JSON com um array chamado "jogos", onde cada item é um objeto com as chaves: "home" (nome do time mandante), "away" (nome do time visitante), "data" (data ex: 23/08) e "hora" (horário ex: 21:30).`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  jogos: {
                    type: "ARRAY",
                    items: {
                      type: "OBJECT",
                      properties: {
                        home: { type: "STRING" },
                        away: { type: "STRING" },
                        data: { type: "STRING" },
                        hora: { type: "STRING" }
                      },
                      required: ["home", "away", "data", "hora"]
                    }
                  }
                },
                required: ["jogos"]
              }
            }
          })
        });

        const resData = await response.json();
        if (!response.ok) throw new Error(resData.error?.message || 'Erro na requisição');

        const result = JSON.parse(resData.candidates[0].content.parts[0].text);
        const jogos = result.jogos || [];

        if (jogos.length === 0) {
          container.innerHTML = `<p style="text-align:center; color: var(--muted); padding:10px;">Nenhum jogo encontrado para ${liga}.</p>`;
          return;
        }

        let html = '';
        jogos.forEach(m => {
          html += `
            <div class="match-item">
              <div>
                <div class="match-teams">${m.home} vs ${m.away}</div>
                <div class="match-time">${m.data} ${m.hora ? 'às ' + m.hora : ''}</div>
              </div>
              <button class="btn-small" onclick="preencherAnalise('${m.home}', '${m.away}')">Analisar</button>
            </div>`;
        });

        container.innerHTML = html;

      } catch (e) {
        container.innerHTML = `<p style="color:var(--danger); text-align:center; padding:10px;">Erro ao carregar jogos (${e.message}).</p>`;
      }
    }

    async function carregarTabela() {
      const container = document.getElementById('tabelaContainer');
      const liga = document.getElementById('competicaoTabela').value;
      const apiKey = obterOuPedirChave();

      container.innerHTML = `<div class="spinner"></div>`;

      const prompt = `Forneça a tabela de classificação atualizada da ${liga}.
Retorne um JSON com uma chave "tabela", contendo um array de objetos com as propriedades: "posicao" (número), "time" (string), "pontos" (número), "jogos" (número), "saldo" (número ou string). Ordene do 1º colocado em diante.`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  tabela: {
                    type: "ARRAY",
                    items: {
                      type: "OBJECT",
                      properties: {
                        posicao: { type: "INTEGER" },
                        time: { type: "STRING" },
                        pontos: { type: "INTEGER" },
                        jogos: { type: "INTEGER" },
                        saldo: { type: "STRING" }
                      },
                      required: ["posicao", "time", "pontos", "jogos", "saldo"]
                    }
                  }
                },
                required: ["tabela"]
              }
            }
          })
        });

        const resData = await response.json();
        if (!response.ok) throw new Error(resData.error?.message || 'Erro na requisição');

        const result = JSON.parse(resData.candidates[0].content.parts[0].text);
        const tabela = result.tabela || [];

        if (tabela.length === 0) {
          container.innerHTML = `<p style="text-align:center; color: var(--muted); padding:10px;">Tabela indisponível.</p>`;
          return;
        }

        let html = `
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Time</th>
                <th>P</th>
                <th>J</th>
                <th>SG</th>
              </tr>
            </thead>
            <tbody>`;

        tabela.forEach(row => {
          html += `
            <tr>
              <td>${row.posicao}</td>
              <td>${row.time}</td>
              <td><b>${row.pontos}</b></td>
              <td>${row.jogos}</td>
              <td>${row.saldo}</td>
            </tr>`;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

      } catch (e) {
        container.innerHTML = `<p style="color:var(--danger); text-align:center; padding:10px;">Erro ao carregar classificação (${e.message}).</p>`;
      }
    }

    function preencherAnalise(home, away) {
      switchTab(2);
      document.getElementById('manualHome').value = home;
      document.getElementById('manualAway').value = away;
    }

    async function analisarComIA() {
      const btn = document.getElementById('btnAnalisar');
      const analiseArea = document.getElementById('analiseArea');
      const home = document.getElementById('manualHome').value.trim();
      const away = document.getElementById('manualAway').value.trim();
      const obs = document.getElementById('observacoes').value.trim();
      const risco = document.getElementById('risco').value;
      const liga = document.getElementById('liga').value;
      const esporte = document.getElementById('esporte').value;

      const apiKey = obterOuPedirChave();

      if (!home || !away) {
        return alert('Preencha os dois times!');
      }

      btn.disabled = true;
      analiseArea.innerHTML = `<div class="spinner"></div><p style="text-align:center; color: var(--muted); font-size: 0.85rem;">IA gerando relatório da partida...</p>`;

      const prompt = `Análise de aposta esportiva: ${home} vs ${away} (${esporte}, Liga: ${liga || 'Geral'}). Risco: ${risco}. ${obs ? 'Obs: ' + obs : ''}.
Retorne um JSON contendo: mercado, entrada, probabilidade, confianca e justificativa.`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  mercado: { type: "STRING" },
                  entrada: { type: "STRING" },
                  probabilidade: { type: "STRING" },
                  confianca: { type: "STRING" },
                  justificativa: { type: "STRING" }
                },
                required: ["mercado", "entrada", "probabilidade", "confianca", "justificativa"]
              }
            }
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || 'Erro na requisição');

        const res = JSON.parse(data.candidates[0].content.parts[0].text);

        analiseArea.innerHTML = `
          <div class="analysis">
            <h3 style="margin-bottom:6px; font-size:1.1rem;">${home} vs ${away}</h3>
            <div style="font-size: 0.9rem; color: var(--muted);">${res.mercado}</div>
            <div style="font-size: 1.2rem; font-weight:bold; margin: 6px 0; color: var(--primary);">${res.entrada}</div>
            <div style="font-size:0.8rem; color:var(--primary); margin-bottom:6px;">Probabilidade: ${res.probabilidade} | Confiança: ${res.confianca}</div>
            <p style="font-size:0.85rem; color:#ccc; line-height: 1.3;">${res.justificativa}</p>
          </div>`;
      } catch (e) {
        analiseArea.innerHTML = `<p style="color: var(--danger); text-align: center; margin-top:10px; font-size:0.85rem;">Erro: ${e.message}</p>`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
