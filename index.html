<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Basquete & IA Pro</title>
  <style>
    :root {
      --bg: #0d0e12;
      --card-bg: #16181e;
      --primary: #ff9800;
      --primary-hover: #f57c00;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #27272a;
      --danger: #ff5252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; }

    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 14px; color: var(--primary); }

    .tabs {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--muted);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .tab.active { background: var(--primary); color: #000; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      background: #09090b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    button {
      width: 100%;
      background: var(--primary);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-small {
      padding: 6px 12px;
      font-size: 0.8rem;
      width: auto;
    }

    .spinner {
      width: 30px; height: 30px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 15px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .match-item {
      background: #09090b;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .match-teams { font-size: 0.9rem; font-weight: bold; display: flex; flex-direction: column; gap: 4px; }
    .team-row { display: flex; align-items: center; gap: 8px; }
    .team-logo { width: 20px; height: 20px; object-fit: contain; }
    .match-time { font-size: 0.75rem; color: var(--primary); margin-top: 4px; }

    .conf-title {
      color: var(--primary);
      margin: 14px 0 6px 0;
      font-size: 0.95rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-bottom: 12px; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .table-team { display: flex; align-items: center; gap: 6px; }

    .analysis {
      background: #09090b;
      border-left: 4px solid var(--primary);
      padding: 14px;
      border-radius: 0 8px 8px 0;
      margin-top: 12px;
    }
    .player-prop {
      background: #16181e;
      padding: 8px;
      border-radius: 6px;
      margin-top: 8px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <h1>Painel de Basquete & IA Pro</h1>

  <div class="tabs">
    <div class="tab active" id="btn-tab-0">&#127936; Próximos Jogos</div>
    <div class="tab" id="btn-tab-1">&#127942; Classificação</div>
    <div class="tab" id="btn-tab-2">&#129302; Analisador IA</div>
  </div>

  <!-- ABA 1: JOGOS -->
  <div class="tab-content active" id="conteudo-tab-0">
    <div class="card">
      <div class="form-group">
        <label>Selecione a Liga</label>
        <select id="ligaJogos">
          <option value="nba">NBA</option>
          <option value="wnba" selected>WNBA</option>
          <option value="mens-euroleague">EuroLiga</option>
          <option value="bra.1">NBB (Brasil)</option>
        </select>
      </div>
      <div id="listaJogos"></div>
    </div>
  </div>

  <!-- ABA 2: CLASSIFICAÇÃO -->
  <div class="tab-content" id="conteudo-tab-1">
    <div class="card">
      <div class="form-group">
        <label>Selecione a Liga</label>
        <select id="ligaTabela">
          <option value="nba">NBA</option>
          <option value="wnba" selected>WNBA</option>
          <option value="mens-euroleague">EuroLiga</option>
          <option value="bra.1">NBB (Brasil)</option>
        </select>
      </div>
      <div id="tabelaContainer" style="overflow-x: auto;"></div>
    </div>
  </div>

  <!-- ABA 3: ANALISADOR IA -->
  <div class="tab-content" id="conteudo-tab-2">
    <div class="card">
      <div class="grid-2">
        <div class="form-group">
          <label>Esporte</label>
          <select id="esporte">
            <option value="Basquete">Basquete</option>
          </select>
        </div>
        <div class="form-group">
          <label>Liga / Campeonato</label>
          <input type="text" id="liga" placeholder="Ex: NBA, WNBA, EuroLiga">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Time Casa / Mandante</label>
          <input type="text" id="manualHome" placeholder="Ex: Boston Celtics">
        </div>
        <div class="form-group">
          <label>Time Fora / Visitante</label>
          <input type="text" id="manualAway" placeholder="Ex: LA Lakers">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Nível de Risco</label>
          <select id="risco">
            <option value="Conservador">Conservador (Baixo Risco)</option>
            <option value="Moderado" selected>Moderado</option>
            <option value="Arriscado">Arriscado (Odds Altas)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Observações / Desfalques</label>
          <input type="text" id="observacoes" placeholder="Ex: Jogador X lesionado">
        </div>
      </div>

      <button id="btnAnalisar">Gerar Análise Avançada</button>
      <div id="analiseArea"></div>
    </div>
  </div>

  <script>
    const GEMINI_API_KEY = 'AQ.Ab8RN6KI_2hgmoYEbuoZ-ohSecyUytC76f0bKJTsys2gPy1Qpg';

    document.addEventListener('DOMContentLoaded', () => {
      // Configurar eventos das abas
      document.getElementById('btn-tab-0').addEventListener('click', () => mudarAba(0));
      document.getElementById('btn-tab-1').addEventListener('click', () => mudarAba(1));
      document.getElementById('btn-tab-2').addEventListener('click', () => mudarAba(2));

      document.getElementById('ligaJogos').addEventListener('change', carregarJogos);
      document.getElementById('ligaTabela').addEventListener('change', carregarTabela);
      document.getElementById('btnAnalisar').addEventListener('click', analisarComIA);

      carregarJogos();
    });

    function mudarAba(index) {
      for (let i = 0; i <= 2; i++) {
        const btn = document.getElementById('btn-tab-' + i);
        const content = document.getElementById('conteudo-tab-' + i);
        if (btn && content) {
          if (i === index) {
            btn.classList.add('active');
            content.classList.add('active');
          } else {
            btn.classList.remove('active');
            content.classList.remove('active');
          }
        }
      }

      if (index === 1) carregarTabela();
    }

    function formatarDataAPI(date) {
      const ano = date.getFullYear();
      const mes = String(date.getMonth() + 1).padStart(2, '0');
      const dia = String(date.getDate()).padStart(2, '0');
      return `${ano}${mes}${dia}`;
    }

    async function carregarJogos() {
      const container = document.getElementById('listaJogos');
      const liga = document.getElementById('ligaJogos').value;
      container.innerHTML = `<div class="spinner"></div>`;

      const hoje = new Date();
      const daquiASeteDias = new Date();
      daquiASeteDias.setDate(hoje.getDate() + 7);

      const inicio = formatarDataAPI(hoje);
      const fim = formatarDataAPI(daquiASeteDias);
      const intervaloDatas = `${inicio}-${fim}`;

      try {
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${liga}/scoreboard?dates=${intervaloDatas}`);
        if (!res.ok) throw new Error('Erro na requisição');

        const data = await res.json();
        const events = data.events || [];

        if (events.length === 0) {
          container.innerHTML = `<p style="text-align:center; color: var(--muted); font-size: 0.85rem; padding: 10px;">Nenhum jogo agendado para os próximos 7 dias nesta liga.</p>`;
          return;
        }

        container.innerHTML = '';
        events.forEach(e => {
          const competition = e.competitions[0];
          const homeTeam = competition.competitors.find(c => c.homeAway === 'home')?.team;
          const awayTeam = competition.competitors.find(c => c.homeAway === 'away')?.team;

          const homeName = homeTeam?.displayName || 'Time Casa';
          const awayName = awayTeam?.displayName || 'Time Fora';
          const homeLogo = homeTeam?.logo || '';
          const awayLogo = awayTeam?.logo || '';
          
          const dateObj = new Date(e.date);
          const diaSemana = dateObj.toLocaleDateString('pt-BR', { weekday: 'short' }).toLowerCase();
          const dataJogo = dateObj.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
          const hora = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          const ligaNome = data.leagues?.[0]?.name || liga.toUpperCase();

          const itemDiv = document.createElement('div');
          itemDiv.className = 'match-item';
          itemDiv.innerHTML = `
            <div>
              <div class="match-teams">
                <div class="team-row"><img src="${homeLogo}" class="team-logo" onerror="this.style.display='none'"><span>${homeName}</span></div>
                <div style="font-size: 0.7rem; color: var(--muted); padding-left: 28px;">vs</div>
                <div class="team-row"><img src="${awayLogo}" class="team-logo" onerror="this.style.display='none'"><span>${awayName}</span></div>
              </div>
              <div class="match-time">${diaSemana}, ${dataJogo} às ${hora}</div>
            </div>
            <button class="btn-small btn-analisar-jogo">Analisar</button>
          `;

          // Atribuição segura do evento de clique via JS nativo
          itemDiv.querySelector('.btn-analisar-jogo').addEventListener('click', () => {
            mudarAba(2);
            document.getElementById('manualHome').value = homeName;
            document.getElementById('manualAway').value = awayName;
            document.getElementById('liga').value = ligaNome;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            analisarComIA();
          });

          container.appendChild(itemDiv);
        });

      } catch (e) {
        container.innerHTML = `<p style="text-align:center; color: var(--muted); font-size: 0.85rem; padding: 10px;">Erro ao carregar os jogos. Tente novamente.</p>`;
      }
    }

    async function carregarTabela() {
      const container = document.getElementById('tabelaContainer');
      const liga = document.getElementById('ligaTabela').value;
      container.innerHTML = `<div class="spinner"></div>`;

      try {
        const res = await fetch(`https://site.api.espn.com/apis/v2/sports/basketball/${liga}/standings`);
        if (!res.ok) throw new Error('Erro ao carregar tabela.');
        const data = await res.json();

        let html = '';

        if (data.children && data.children.length > 0) {
          data.children.forEach(conf => {
            const confNome = conf.name || 'Conferência';
            let entries = conf.standings?.entries || [];
            if (entries.length > 0) {
              html += `<div class="conf-title">${confNome}</div>`;
              html += renderTabelaHTML(entries);
            }
          });
        } else if (data.standings?.entries) {
          html = renderTabelaHTML(data.standings.entries);
        }

        if (!html) {
          container.innerHTML = `<p style="text-align:center; color: var(--muted); font-size: 0.85rem; padding: 10px;">Tabela indisponível no momento.</p>`;
          return;
        }

        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = `<p style="text-align:center; color: var(--muted); font-size: 0.85rem; padding: 10px;">Classificação indisponível para esta liga no momento.</p>`;
      }
    }

    function renderTabelaHTML(entries) {
      let html = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Time</th>
              <th>V</th>
              <th>D</th>
              <th>%</th>
            </tr>
          </thead>
          <tbody>`;

      entries.forEach((row, idx) => {
        const stats = row.stats || [];
        const getStat = (name) => {
          const item = stats.find(s => s.name === name || s.type === name);
          return item ? item.value : 0;
        };

        const wins = getStat('wins');
        const losses = getStat('losses');
        const winPercent = (getStat('winPercent') * 100).toFixed(1);
        const teamName = row.team?.displayName || 'Time';
        const teamLogo = row.team?.logos?.[0]?.href || row.team?.logo || '';

        html += `
          <tr>
            <td>${idx + 1}</td>
            <td>
              <div class="table-team">
                <img src="${teamLogo}" class="team-logo" onerror="this.style.display='none'">
                <span>${teamName}</span>
              </div>
            </td>
            <td><b>${wins}</b></td>
            <td>${losses}</td>
            <td>${winPercent}%</td>
          </tr>`;
      });

      html += `</tbody></table>`;
      return html;
    }

    async function analisarComIA() {
      const btn = document.getElementById('btnAnalisar');
      const analiseArea = document.getElementById('analiseArea');
      const home = document.getElementById('manualHome').value.trim();
      const away = document.getElementById('manualAway').value.trim();
      const obs = document.getElementById('observacoes').value.trim();
      const risco = document.getElementById('risco').value;
      const liga = document.getElementById('liga').value;

      if (!home || !away) {
        return alert('Preencha os dois times!');
      }

      btn.disabled = true;
      analiseArea.innerHTML = `<div class="spinner"></div><p style="text-align:center; color: var(--muted); font-size: 0.85rem;">Gerando análise...</p>`;

      const prompt = `Analise o jogo de basquete: ${home} vs ${away} (Liga: ${liga || 'Geral'}). Nível de risco: ${risco}. ${obs ? 'Observações: ' + obs : ''}.
Forneça palpite de jogo e jogador em JSON exatamente assim:
{
  "mercado": "Vencedor / Total de Pontos",
  "entrada": "Palpite da Partida",
  "probabilidade": "75%",
  "confianca": "Alta",
  "justificativa": "Resumo da análise",
  "jogador_nome": "Nome do Jogador",
  "jogador_palpite": "Mais de 20.5 Pontos",
  "jogador_media": "22.4 pts",
  "jogador_motivo": "Explicacao rapida"
}`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`;

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || 'Erro na requisição');

        const rawText = data.candidates[0].content.parts[0].text;
        const res = JSON.parse(rawText);

        analiseArea.innerHTML = `
          <div class="analysis">
            <h3 style="margin-bottom:4px; font-size:1.1rem;">${home} vs ${away}</h3>
            <div style="font-size: 0.85rem; color: var(--muted);">${res.mercado}</div>
            <div style="font-size: 1.1rem; font-weight:bold; margin: 4px 0; color: var(--primary);">${res.entrada}</div>
            <div style="font-size:0.75rem; color:var(--primary); margin-bottom:10px;">Probabilidade: ${res.probabilidade} | Confiança: ${res.confianca}</div>
            <p style="font-size:0.85rem; color:#ccc; line-height: 1.3; margin-bottom: 12px;">${res.justificativa}</p>
            
            <div class="player-prop">
              <div style="font-size:0.8rem; color:var(--primary); font-weight:bold; text-transform:uppercase;">&#128293; Destaque Individual</div>
              <div style="font-size:0.95rem; font-weight:bold; margin-top:2px;">${res.jogador_nome}</div>
              <div style="font-size:0.9rem; color:#fff; font-weight:bold; margin: 2px 0;">Entrada: <span style="color:var(--primary);">${res.jogador_palpite}</span></div>
              <div style="font-size:0.8rem; color:var(--muted);">Média estimada: ${res.jogador_media}</div>
              <p style="font-size:0.8rem; color:#aaa; margin-top:4px;">${res.jogador_motivo}</p>
            </div>
          </div>`;
      } catch (e) {
        analiseArea.innerHTML = `<p style="color: var(--danger); text-align: center; margin-top:10px; font-size:0.85rem;">Erro na análise: ${e.message}</p>`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
