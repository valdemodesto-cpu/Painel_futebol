<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Futebol & IA</title>
  <link rel="icon" type="image/png" href="1787440803187.png">
  <link rel="apple-touch-icon" href="1787440803187.png">
  <style>
    :root {
      --bg: #0d0e12;
      --card-bg: #16181e;
      --primary: #00e676;
      --primary-hover: #00c853;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #27272a;
      --danger: #ff5252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; }

    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 14px; color: var(--primary); }

    .tabs {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--muted);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .tab.active { background: var(--primary); color: #000; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      background: #09090b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    button {
      width: 100%;
      background: var(--primary);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-small {
      padding: 6px 12px;
      font-size: 0.8rem;
      width: auto;
    }

    .spinner {
      width: 30px; height: 30px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 15px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .match-item {
      background: #09090b;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .match-teams { font-size: 0.9rem; font-weight: bold; }
    .match-time { font-size: 0.75rem; color: var(--primary); margin-top: 2px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }

    .analysis {
      background: #09090b;
      border-left: 4px solid var(--primary);
      padding: 14px;
      border-radius: 0 8px 8px 0;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <h1>Painel de Futebol & IA</h1>

  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">⚽ Jogos Hoje</div>
    <div class="tab" onclick="switchTab(1)">🏆 Classificação</div>
    <div class="tab" onclick="switchTab(2)">🤖 Analisador IA</div>
  </div>

  <!-- ABA 1: JOGOS DO DIA -->
  <div class="tab-content active" id="tab-jogos">
    <div class="card">
      <div class="form-group">
        <label>Selecione a Competição</label>
        <select id="competicaoJogos" onchange="carregarJogos()">
          <option value="BSA">🇧🇷 Brasileirão Série A</option>
          <option value="PL">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League (Inglaterra)</option>
          <option value="PD">🇪🇸 La Liga (Espanha)</option>
          <option value="SA">🇮🇹 Serie A (Itália)</option>
          <option value="FL1">🇫🇷 Ligue 1 (França)</option>
          <option value="CL">🇪🇺 UEFA Champions League</option>
          <option value="ELC">🏴󠁧󠁢󠁥󠁮󠁧󠁿 EFL Championship</option>
          <option value="PPL">🇵🇹 Primeira Liga (Portugal)</option>
          <option value="DED">🇳🇱 Eredivisie (Holanda)</option>
          <option value="WC">🌍 Copa do Mundo / FIFA</option>
        </select>
      </div>
      <div id="listaJogos"></div>
    </div>
  </div>

  <!-- ABA 2: CLASSIFICAÇÃO -->
  <div class="tab-content" id="tab-tabela">
    <div class="card">
      <div class="form-group">
        <label>Selecione o Campeonato</label>
        <select id="competicaoTabela" onchange="carregarTabela()">
          <option value="BSA">🇧🇷 Brasileirão Série A</option>
          <option value="PL">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League (Inglaterra)</option>
          <option value="PD">🇪🇸 La Liga (Espanha)</option>
          <option value="SA">🇮🇹 Serie A (Itália)</option>
          <option value="FL1">🇫🇷 Ligue 1 (França)</option>
          <option value="CL">🇪🇺 UEFA Champions League</option>
          <option value="ELC">🏴󠁧󠁢󠁥󠁮󠁧󠁿 EFL Championship</option>
          <option value="PPL">🇵🇹 Primeira Liga (Portugal)</option>
          <option value="DED">🇳🇱 Eredivisie (Holanda)</option>
          <option value="WC">🌍 Copa do Mundo / FIFA</option>
        </select>
      </div>
      <div id="tabelaContainer" style="overflow-x: auto;"></div>
    </div>
  </div>

  <!-- ABA 3: ANALISADOR IA -->
  <div class="tab-content" id="tab-analisador">
    <div class="card">
      <div class="grid-2">
        <div class="form-group">
          <label>Esporte</label>
          <select id="esporte">
            <option value="Futebol">Futebol</option>
            <option value="Basquete (NBA)">Basquete (NBA)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Liga / Campeonato</label>
          <input type="text" id="liga" placeholder="Ex: Brasileirão">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Time Casa / Mandante</label>
          <input type="text" id="manualHome" placeholder="Ex: Flamengo">
        </div>
        <div class="form-group">
          <label>Time Fora / Visitante</label>
          <input type="text" id="manualAway" placeholder="Ex: Vasco">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Nível de Risco</label>
          <select id="risco">
            <option value="Conservador">Conservador (Baixo Risco)</option>
            <option value="Moderado" selected>Moderado</option>
            <option value="Arriscado">Arriscado (Odds Altas)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Observações / Infos</label>
          <input type="text" id="observacoes" placeholder="Ex: Titulares poupados">
        </div>
      </div>

      <button id="btnAnalisar" onclick="analisarComIA()">Gerar Análise</button>
      <div id="analiseArea"></div>
    </div>
  </div>

  <script>
    const GEMINI_API_KEY = 'AQ.Ab8RN6JTqKAta9oKhuHY1t7PjXiS32ul3EQNG5fS10Mzehl1gA'; 
    const FOOTBALL_API_KEY = '9885b8e085ef4ff8bbeab09d25043cab'; 

    document.addEventListener('DOMContentLoaded', () => {
      carregarJogos();
    });

    function switchTab(index) {
      const tabs = document.querySelectorAll('.tab');
      const contents = document.querySelectorAll('.tab-content');
      
      tabs.forEach((t, i) => {
        t.classList.toggle('active', i === index);
        contents[i].classList.toggle('active', i === index);
      });

      if(index === 0) carregarJogos();
      if(index === 1) carregarTabela();
    }

    async function carregarTabela() {
      const container = document.getElementById('tabelaContainer');
      const codigoLiga = document.getElementById('competicaoTabela').value;
      container.innerHTML = `<div class="spinner"></div>`;

      if(!FOOTBALL_API_KEY || FOOTBALL_API_KEY.includes('SEU_TOKEN')) {
        container.innerHTML = `<p style="color:var(--muted); text-align:center; font-size:0.85rem; padding:10px;">Insira a <b>FOOTBALL_API_KEY</b> no código.</p>`;
        return;
      }

      try {
        const targetUrl = `https://api.football-data.org/v4/competitions/${codigoLiga}/standings`;
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

        const response = await fetch(proxyUrl, {
          headers: { 'X-Auth-Token': FOOTBALL_API_KEY }
        });

        if (!response.ok) throw new Error(`Status HTTP: ${response.status}`);

        const data = await response.json();
        const standings = data.standings?.[0]?.table;

        if (!standings) throw new Error('Dados indisponíveis para esta competição');

        let html = `
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Time</th>
                <th>P</th>
                <th>J</th>
                <th>SG</th>
              </tr>
            </thead>
            <tbody>`;

        standings.forEach(row => {
          html += `
            <tr>
              <td>${row.position}</td>
              <td>${row.team.shortName || row.team.name}</td>
              <td><b>${row.points}</b></td>
              <td>${row.playedGames}</td>
              <td>${row.goalDifference > 0 ? '+' + row.goalDifference : row.goalDifference}</td>
            </tr>`;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

      } catch (e) {
        container.innerHTML = `<p style="color:var(--danger); text-align:center; font-size:0.85rem;">Erro ao carregar tabela (${e.message}).</p>`;
      }
    }

    async function carregarJogos() {
      const container = document.getElementById('listaJogos');
      const codigoLiga = document.getElementById('competicaoJogos').value;
      container.innerHTML = `<div class="spinner"></div>`;

      if(!FOOTBALL_API_KEY || FOOTBALL_API_KEY.includes('SEU_TOKEN')) {
        container.innerHTML = `<p style="color:var(--muted); text-align:center; font-size:0.85rem; padding:10px;">Insira a <b>FOOTBALL_API_KEY</b> no código.</p>`;
        return;
      }

      try {
        const targetUrl = `https://api.football-data.org/v4/competitions/${codigoLiga}/matches?status=SCHEDULED`;
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

        const response = await fetch(proxyUrl, {
          headers: { 'X-Auth-Token': FOOTBALL_API_KEY }
        });

        if (!response.ok) throw new Error(`Status HTTP: ${response.status}`);

        const data = await response.json();
        const matches = data.matches || [];

        if (matches.length === 0) {
          container.innerHTML = `<p style="text-align:center; color: var(--muted); font-size: 0.85rem; padding: 10px;">Nenhum jogo agendado encontrado nesta competição no momento.</p>`;
          return;
        }

        let html = '';
        matches.slice(0, 10).forEach(m => {
          const home = m.homeTeam.shortName || m.homeTeam.name;
          const away = m.awayTeam.shortName || m.awayTeam.name;
          const dataJogo = new Date(m.utcDate).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
          const hora = new Date(m.utcDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          html += `
            <div class="match-item">
              <div>
                <div class="match-teams">${home} vs ${away}</div>
                <div class="match-time">${dataJogo} às ${hora}</div>
              </div>
              <button class="btn-small" onclick="preencherAnalise('${home}', '${away}', '${codigoLiga}')">Analisar</button>
            </div>`;
        });

        container.innerHTML = html;

      } catch (e) {
        container.innerHTML = `<p style="color:var(--danger); text-align:center; font-size:0.85rem;">Erro ao carregar jogos (${e.message}).</p>`;
      }
    }

    function preencherAnalise(home, away, liga) {
      switchTab(2);
      document.getElementById('manualHome').value = home;
      document.getElementById('manualAway').value = away;
      document.getElementById('liga').value = liga;
    }

    async function analisarComIA() {
      const btn = document.getElementById('btnAnalisar');
      const analiseArea = document.getElementById('analiseArea');
      const home = document.getElementById('manualHome').value.trim();
      const away = document.getElementById('manualAway').value.trim();
      const obs = document.getElementById('observacoes').value.trim();
      const risco = document.getElementById('risco').value;
      const liga = document.getElementById('liga').value;
      const esporte = document.getElementById('esporte').value;

      if (!GEMINI_API_KEY || GEMINI_API_KEY.includes('SUA_CHAVE_GEMINI')) {
        return alert('Configure sua chave de API do Gemini no código JS!');
      }
      if (!home || !away) {
        return alert('Preencha os dois times!');
      }

      btn.disabled = true;
      analiseArea.innerHTML = `<div class="spinner"></div><p style="text-align:center; color: var(--muted); font-size: 0.85rem;">IA gerando relatório da partida...</p>`;

      const prompt = `Análise de aposta esportiva: ${home} vs ${away} (${esporte}, Liga: ${liga || 'Geral'}). Risco: ${risco}. ${obs ? 'Obs: ' + obs : ''}.
Retorne um JSON contendo: mercado, entrada, probabilidade, confianca e justificativa.`;

      try {
        // Atualizado para o endpoint do modelo gemini-3.6-flash
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`;

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  mercado: { type: "STRING" },
                  entrada: { type: "STRING" },
                  probabilidade: { type: "STRING" },
                  confianca: { type: "STRING" },
                  justificativa: { type: "STRING" }
                },
                required: ["mercado", "entrada", "probabilidade", "confianca", "justificativa"]
              }
            }
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || 'Erro na requisição');

        const res = JSON.parse(data.candidates[0].content.parts[0].text);

        analiseArea.innerHTML = `
          <div class="analysis">
            <h3 style="margin-bottom:6px; font-size:1.1rem;">${home} vs ${away}</h3>
            <div style="font-size: 0.9rem; color: var(--muted);">${res.mercado}</div>
            <div style="font-size: 1.2rem; font-weight:bold; margin: 6px 0; color: var(--primary);">${res.entrada}</div>
            <div style="font-size:0.8rem; color:var(--primary); margin-bottom:6px;">Probabilidade: ${res.probabilidade} | Confiança: ${res.confianca}</div>
            <p style="font-size:0.85rem; color:#ccc; line-height: 1.3;">${res.justificativa}</p>
          </div>`;
      } catch (e) {
        analiseArea.innerHTML = `<p style="color: var(--danger); text-align: center; margin-top:10px; font-size:0.85rem;">Erro: ${e.message}</p>`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
